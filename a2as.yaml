    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), ../graphic-tool]
  .env:
    type: literal
    actions: [read]
    params:
      path: [current_dir]
  config/cuez_api_swagger.json:
    type: literal
    actions: [read]
    params:
      caller: [open]
      alias: [f]
  config/system-instructions.txt:
    type: literal
    actions: [read]
    params:
      caller: [open]
      alias: [f]
  config_path:
    type: variable
    actions: [read]
    params:
      caller: [open, yaml.safe_load]
      alias: [file]
  file_path:
    type: variable
    actions: [read]
    params:
      caller: [open]
      alias: [f]
  path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, open]
  remote_agents_config.yaml:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), remote_agents_config.yaml]
  system_instructions.txt:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [script_dir, system_instructions.txt]
  urlparse.path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.basename]

