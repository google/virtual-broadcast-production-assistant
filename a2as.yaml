functions:
  __init__:
    type: sync
    module: orchestrator.agent.broadcast_orchestrator.agent
    args: [self, task_callback]
  _build_agent:
    type: sync
    module: shure-audio-agent.agent
    args: [self]
    params:
      returns: LlmAgent
  _extract_parts_from_response:
    type: async
    module: orchestrator.agent.broadcast_orchestrator.timeline_manager
    args: [response_data]
    params:
      returns: list[dict]
  _get_event_collection:
    type: sync
    module: orchestrator.agent.broadcast_orchestrator.firestore_observer
    args: [self, context]
    params:
      returns: firestore_async.AsyncCollectionReference
  _get_formatted_instructions:
    type: sync
    module: orchestrator.agent.broadcast_orchestrator.agent
    args: [self, rundown_system_preference]
    params:
      returns: str
  _init_firebase_if_needed:
    type: sync
    module: tx.tx_agent.agent.firestore_repo
  _load_agents_from_firestore:
    type: async
    module: orchestrator.agent.broadcast_orchestrator.agent
    args: [self]
  _parse_spelling_errors_from_text:
    type: async
    module: orchestrator.agent.broadcast_orchestrator.timeline_manager
    args: [text]
    params:
      returns: list[dict]
  _process_media_clips:
    type: async
    module: orchestrator.agent.broadcast_orchestrator.timeline_manager
    args: [parts]
    params:
      returns: list[dict]
  _process_request:
    type: async
    module: itn-posture.itn-posture-agent.agent_executor
    args: [self, new_message, session_id, task_updater]
    params:
      returns: None
