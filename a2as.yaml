    ports: ["443"]
    params:
      caller: [upload_base64_image_to_gcs]
  o182678.ingest.us.sentry.io:
    type: api
    actions: [GET]
    urls: [/4509923209314304]
    protocols: [https]
    ports: ["443"]
    params:
