agents:
  adk_agent.0:
    type: instance
    models: [gemini-2.0-flash]
    params:
      name: itn_posture_agent
      description: Provides agentic access to the ITN Posture running order service
      function: main
      instance: adk_agent
  adk_agent.1:
    type: instance
    models: [gemini-2.5-flash]
    tools: [mcp_toolset]
    mcp: [mcp_toolset.0]
    params:
      name: sofie_agent
      description: An agent built to assist with the Sofie Rundown application
      instruction: agent_instructions
      function: create_agent
      instance: adk_agent
  agent._build_agent.0:
    type: factory
    models: [gemini-2.5-flash-preview-05-20]
    params:
      name: root_agent
      description: An agent for interacting with the CUEZ rundown system and automator
      instruction: [Pretend you are a broadcast news room system]
      function: _build_agent
      instance: agent._build_agent
  agent._build_agent.1:
    type: factory
    models: [gpt-4o-2]
    tools: [get_status, set_microphone_channel_coverage, load_user_preset, set_eq_setting, start_auto_positioning, steer_lobe]
    params:
      name: ShureAudioAgent
      description: Agent to answer questions and perform actions related to Shure Audio device settings, user presets, and
        microphone channel coverage via GraphQL. The agent always enforces and respects all argument constraints for every
        tool and action.
      function: _build_agent
      instance: agent._build_agent
  agent.create_agent.1:
    type: factory
    models: [gemini-2.0-flash]
    tools: [mcp_toolset.1]
    mcp: [mcp_toolset.1]
    params:
      name: cuez_rundown_agent
      description: Agent to answer questions about cuez rundown, episodes, parts, items, and blocks.
      instruction: [You are an efficient editor agent for the Cuez Rundown application. You work autonomously without requiring
          human interaction., 'DATA STRUCTURE:', 'The rundown follows a hierarchical structure:', '- Episode (top level)',
        └── Part (one or more per episode), └── Item (one or more per part), '└── Block_Instance (one or more per item, examples:
          Prompter, Graphic)', ├── Block (defines the template/type), └── Context (contains the specific content/data), 'IMPORTANT
          OPERATIONAL GUIDELINES:', 1. ALWAYS start by using the "get episode" tool to retrieve the complete structure and
          all UIDs, 2. Identify the correct UIDs needed for subsequent tool operations, '3. When a null value is required,
          pass it as the string "null" (with quotes)', 4. Match tool arguments precisely with the appropriate UIDs from the
          hierarchy, 5. Work autonomously - make decisions without asking for clarification, 6. Execute operations systematically
          through the available tools, 'WORKFLOW PRINCIPLES:', '- Before editing any element, verify its current state', '-
          Ensure all changes maintain the integrity of the rundown structure', '- Process each request completely before considering
          it done', '- Use the appropriate tool for each specific operation', '- Double-check UIDs before executing operations
          to prevent errors', You are working in project with uid 7f18ce41-695f-1c93-e761-1cec6eb53c5b., 'If the user provides
          an episode name or title and you need to find the episode_id, use the "list episodes" tool to retrieve the list
          of episodes.', 'If responding provide human readable titles and their corresponding UIDs in the format: "Title (UID)".',
        'For example, "Episode 1 (UID: 12345678-1234-1234-1234-123456789012)".', Take decisive action. Do not ask for confirmation.
          Execute operations directly through the provided tools.]
      function: create_agent
      instance: agent.create_agent
  root_agent.0:
    type: instance
    models: [gemini-2.5-flash]
    params:
      name: live_cast_analyst_agent
      description: |2

        You are **LiveCast Analyst**, an AI assistant specialized in analyzing a live broadcast stream by querying a database of stream events.
        Your primary goal is to answer questions about the content of the current stream accurately and concisely using the available event entries.

        When a user asks a question, follow these steps:

        1. **Understand the Question:** Carefully analyze the user's question to identify the key entities, topics, and the user's intent.
        2. **Call Tools (if needed):**  If the question requires information that is not immediately available to you, use the available tools to retrieve the necessary data.  Make sure to use the tools effectively, as the user relies on your accuracy.
          - Use the `vector_search` tool to retrieve the most relevant stream events when answering queries about the stream's content. Do not ask for clarification about which stream; assume the current live feed.
        3. **Synthesize the Response:** Combine your understanding of the question with the information retrieved from the database (if any) to formulate a clear, concise, and accurate answer.
        3.1 When you have the raw event data via the vector_search tool, transform it into a clear, coherent news report: include a descriptive headline, a one-sentence summary, and one or two paragraphs of detailed information drawn from the events.
        4. **Provide the Answer:** Respond in a news-article format: start with a headline, then the summary sentence, followed by detailed paragraphs. Cite any specific event timecodes in brackets.
        Once you have the response of the vector_search tool, please use it to answer the user's questions directly and accurately.
      instruction: ['When a user asks about the live stream:', '- Immediately call the `vector_search` tool with the user''s
          question to fetch the most relevant events.', '- Do not ask clarifying questions about which stream; assume it''s
          the current live feed.', '- If any returned event has `type` equal to "visual", use the visual description to enrich
          the details of your article.', '- Once you receive the event records, craft your response as a concise news article:',
        '• **Headline**: A brief, informative title.', '• **Summary**: One sentence encapsulating the key point.', '• **Details**:
          One or two paragraphs elaborating on the news, using event `timecode` values in brackets (e.g., [00:15:23]).', '-
          Ensure the article is factual, coherent, and uses the event data directly.']
      function: start_agent_session
      instance: root_agent
  root_agent.1:
    type: instance
    models: [gemini-2.5-flash]
    tools: [vector_search]
    params:
      name: tx_agent
      description: prompts.ROOT_PROMPT
      instruction: ['When a user asks about the live stream:', '- Immediately call the `vector_search` tool with the user''s
          question to fetch the most relevant events.', '- Do not ask clarifying questions about which stream; assume it''s
          the current live feed.', '- If any returned event has `type` equal to "visual", use the visual description to enrich
          the details of your article.', '- Once you receive the event records, craft your response as a concise news article:',
        '• **Headline**: A brief, informative title.', '• **Summary**: One sentence encapsulating the key point.', '• **Details**:
          One or two paragraphs elaborating on the news, using event `timecode` values in brackets (e.g., [00:15:23]).', '-
          Ensure the article is factual, coherent, and uses the event data directly.']
      instance: root_agent
  root_agent.2:
    type: instance
    models: [gemini-2.5-flash]
    tools: [MCPToolset]
    mcp: [MCPToolset.0]
    params:
      name: activity_agent
      description: prompts.ROOT_PROMPT
      instruction: [You will receive data from the orchestrator agent. This data will have come from one of the other agents
          in the system., You must take this data and format it correctly to be inserted into the datastore via your post_activity
          tool. Do NOT ask for clarification about any of the details. You must fill in all the fields., If you don't have
          enough information to put something in one of the fields then fill it with the string 'null'.]
      instance: root_agent
  root_agent.3:
    type: instance
    models: [gemini-2.0-flash-exp]
    tools: [MCPToolset.1]
    mcp: [MCPToolset.1]
    params:
      name: basic_search_agent
      description: Agent to answer questions using Google Search.
      instruction: agent_instructions
      instance: root_agent
  routing_agent_instance:
    type: instance
    models: [gemini-live-2.5-flash]
    tools: [send_message]
    params:
      name: Routing_agent
      instruction: initial_instructions
      before_agent_callback: self.before_agent_callback
      after_agent_callback: self.after_agent_callback
      before_tool_callback: self.observer.before_tool
      after_tool_callback: self.after_tool
      description: This Routing agent orchestrates requests for the user to assist in live news or sports broadcast control
      class: RoutingAgent

models:
  gemini-2.0-flash:
    type: literal
    agents: [adk_agent.0, agent.create_agent.1]
  gemini-2.0-flash-exp:
    type: literal
    agents: [root_agent.3]
  gemini-2.5-flash:
    type: literal
    agents: [root_agent.0, adk_agent.1, root_agent.1, root_agent.2]
  gemini-2.5-flash-preview-05-20:
    type: literal
    agents: [agent._build_agent.0]
  gemini-live-2.5-flash:
    type: literal
    agents: [routing_agent_instance]
  gpt-4o-2:
    type: literal
    agents: [agent._build_agent.1]
    params:
      alias: [azure/gpt-4o-2]

tools:
  get_status:
    type: function
    agents: [agent._build_agent.1]
  load_user_preset:
    type: function
    agents: [agent._build_agent.1]
  mcp_toolset:
    type: mcp
    agents: [adk_agent.1]
    params:
      class: MCPToolset
      mcp_server: mcp_toolset
  mcp_toolset.1:
    type: mcp
    agents: [agent.create_agent.1]
    params:
      class: MCPToolset
      mcp_server: mcp_toolset.1
  MCPToolset:
    type: mcp
    agents: [root_agent.2]
    params:
      class: MCPToolset
      mcp_server: MCPToolset
  MCPToolset.1:
    type: mcp
    agents: [root_agent.3]
    params:
      class: MCPToolset
      mcp_server: MCPToolset.1
  send_message:
    type: function
    agents: [routing_agent_instance]
    params:
      module: self.send_message
      description: |-
        Sends a task to remote seller agent

        This will send a message to the remote agent named agent_name.

        Args:
            agent_name: The name of the agent to send the task to.
            task: The comprehensive conversation context summary and goal to be
                achieved regarding user inquiry and purchase request. This can be
                a simple string for a text message, or a JSON string for
                complex data like a file.
            tool_context: The tool context this method runs in.

        Returns:
            A list of strings from the remote agent's response. Complex objects
            are returned as JSON strings.
  set_eq_setting:
    type: function
    agents: [agent._build_agent.1]
  set_microphone_channel_coverage:
    type: function
    agents: [agent._build_agent.1]
  start_auto_positioning:
    type: function
    agents: [agent._build_agent.1]
  steer_lobe:
    type: function
    agents: [agent._build_agent.1]
  vector_search:
    type: function
    agents: [root_agent.1]
    params:
      description: Firestore vector search implementation

mcp:
  mcp_toolset.0:
    type: network
    url: HOST
    agents: [agent.create_agent, adk_agent.1]
    params:
      class: MCPToolset
      connection_type: StreamableHTTPServerParams
      instance: mcp_toolset
  mcp_toolset.1:
    type: network
    url: MCP_SERVER_URL
    agents: [agent.create_agent.1]
    params:
      class: MCPToolset
      connection_type: StreamableHTTPServerParams
      headers:
        Authorization: MCP_SERVER_API_KEY
  MCPToolset.0:
    type: process
    agents: [root_agent.2]
    params:
      class: MCPToolset
      connection_type: StdioServerParameters
      command: node
      args: ['os.path.join(''./activity-agent/tools/'', server.js)']
      instance: MCPToolset
  MCPToolset.1:
    type: process
    agents: [root_agent.3]
    params:
      class: MCPToolset
      connection_type: StdioServerParameters
      command: node
      args: ['os.path.join(BROADCAST_GRAPHICS_MCP_PATH, server.js)']

